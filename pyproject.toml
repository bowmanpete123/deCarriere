[project]
name = "htmlCV"
version = "2024.03.13"
authors = [{ name = "Peter Bowman", email = "peter.ralph.bowman@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic",
  "pydantic[email]",
  "Nuitka",
  "pyinstaller",
  "Jinja2",
  "pyyaml",
]

[dependency-groups]
dev = [
  "ruff",
  "ty",
  "debugpy",
  "pytest",
  "pytest-mock",
  "pytest-cov",
  "pyright",
  "docformatter",
]

[tool.docformatter]
line_length = 120
pre_summary_newline = true
post_summary_newline = true
make_summary_multi_line = false
force_wrap = false
use_double_quotes = true
